client:
  task: banana
  policy_host: 127.0.0.1
  policy_port: 8000
  observation_source: bridge
  state_dim: 16
  fps: 30.0
  publish_rate: 300.0
  max_inferences: 20
  execution_horizon: 1
  prompt: "Put the banana on the plate."

safety:
  max_arm_delta_rad: 0.08
  max_chunk_size: 10
  max_inference_ms: 5000
  max_observation_age_ms: 500
  gripper_min: 0.0
  gripper_max: 1.0
  # Add the 14 hardware-approved arm-joint limits before real execution.
  joint_lower: null
  joint_upper: null

robot:
  ip: ROBOT_IP
  port: 5000
  init_joints:
    - 0.026899
    - 0.2612
    - -0.02709991
    - -1.5477003
    - 0.265
    - 0.0180999
    - -0.0614999
    - 0.008999
    - -0.269
    - 0.02069998
    - -1.5567001
    - -0.254
    - -0.02309972
    - 0.06469989
  init_head: null
  state_queue_maxlen: 7
  polling_rate: 200.0
  connection_timeout: 5.0

bridge:
  host: wss://BRIDGE_HOST
  ws_path: /bridge/ws
  state_source: bridge
  image_max_fps: 0
  align_max_delay_ms: 200
  verify_tls: false

camera:
  camera_names: [cam_high, cam_left_wrist, cam_right_wrist]
  resolution: [480, 640, 3]
  fps: 30
  max_queue_size: 10
  save_debug_images: false
